# The firewall's resolver for its agents, with the Ansible role's settings (mitmbox.yml). It answers
# every name: the proxy is what filters. It logs no queries, only its start, its upstreams and errors.
# It does not answer from this machine's /etc/hosts (its own names are not for the agents).
# Where it listens is set next to it: install.sh (/etc/controlclaw/dnsmasq.conf), or the container's
# own addresses in the image.
server=1.1.1.1
server=8.8.8.8
cache-size=1000
no-hosts
