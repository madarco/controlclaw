name: cp POST /doctor
agent: control-plane
endpoint: /doctor
scope: saas-only
seed:
  vms:
    - {id: cpdoct_fw, role: mitm, name: fw, private_ip: 10.0.0.2}
    - {id: cpdoct_a1, role: openclaw, name: cp-a1, private_ip: 10.0.0.3}
steps:
  - name: no token
    request: {method: POST, path: /api/vm-agent/doctor, json: {}}
    expect: {status: 401, json: {error: Unauthorized}}
  - name: an agent may not send it
    request: {method: POST, path: /api/vm-agent/doctor, as: cpdoct_a1, json: {}}
    expect: {status: 403, json: {error: Forbidden}}
  - name: a body that is not one
    request: {method: POST, path: /api/vm-agent/doctor, as: cpdoct_fw, json: {nothing: here}}
    expect: {status: 400, json_subset: {error: $string}}
