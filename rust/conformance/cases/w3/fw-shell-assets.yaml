name: firewall page shell serves its theme script and stylesheet without a grant
agent: mitm-agent
steps:
  - name: the theme script
    request: {method: GET, path: /__cc/doctor/ui/shell.js, listener: ingress}
    expect:
      status: 200
      body: '(function(){var m=window.matchMedia("(prefers-color-scheme: dark)");var a=function(){document.documentElement.classList.toggle("dark",m.matches)};a();m.addEventListener("change",a)})();'
      headers: {content-type: "text/javascript; charset=utf-8", cache-control: "public, max-age=3600", x-content-type-options: nosniff, referrer-policy: same-origin, content-security-policy: "default-src 'none'; frame-ancestors 'none'"}
  - name: a stylesheet named for an older build gets the current one, not cached
    request: {method: GET, path: /__cc/doctor/ui/shell-000000000000.css, listener: ingress}
    expect: {status: 200, headers: {content-type: "text/css; charset=utf-8", cache-control: no-store}}
  - name: anything else under the prefix
    request: {method: GET, path: /__cc/doctor/ui/other.css, listener: ingress}
    expect: {status: 404, body: "", headers: {content-type: "text/plain; charset=utf-8", cache-control: no-store}}
  - name: read only
    request: {method: POST, path: /__cc/doctor/ui/shell.js, listener: ingress}
    expect: {status: 405, body: ""}
