name: firewall Logs page answers only behind its door
agent: mitm-agent
steps:
  - name: the open script posts the intent from the fragment
    request: {method: GET, path: /__cc/doctor/logs/open.js, listener: ingress}
    expect:
      status: 200
      body: 'const p=new URLSearchParams(location.hash.slice(1)),intent=p.get("i");history.replaceState(null,"",location.pathname);if(!intent){document.getElementById("status").textContent="Open the firewall logs from the console."}else{const form=document.createElement("form");form.method="POST";form.action="/__cc/doctor/logs/open";const input=document.createElement("input");input.type="hidden";input.name="intent";input.value=intent;form.append(input);document.body.append(form);form.submit()}'
      headers: {content-type: "text/javascript; charset=utf-8", cache-control: no-store, referrer-policy: same-origin, x-content-type-options: nosniff}
  - name: the opening notice
    request: {method: GET, path: /__cc/doctor/logs/open, listener: ingress}
    expect: {status: 200, headers: {content-type: "text/html; charset=utf-8"}}
  - name: no grant, no page
    request: {method: GET, path: /__cc/doctor/logs/, listener: ingress}
    expect: {status: 403, headers: {content-type: "text/html; charset=utf-8", cache-control: no-store}}
  - name: an open from another origin
    request: {method: POST, path: /__cc/doctor/logs/open, listener: ingress, headers: {origin: "https://evil.example", content-type: application/x-www-form-urlencoded}}
    expect: {status: 403, body: ""}
  - name: an open from this firewall's origin that is not a form
    request: {method: POST, path: /__cc/doctor/logs/open, listener: ingress, headers: {origin: "https://fw.example", content-type: text/plain}}
    expect: {status: 415, body: ""}
  - name: an open with no intent
    request: {method: POST, path: /__cc/doctor/logs/open, listener: ingress, headers: {origin: "https://fw.example", content-type: application/x-www-form-urlencoded}}
    expect: {status: 403, headers: {content-type: "text/html; charset=utf-8"}}
