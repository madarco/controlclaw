name: "panel API: the admin password changes, the other sessions end, and the pairing address"
agent: mitm-agent
skip:
  ts: "the panel API is in the Rust build only"
ports:
  panel: CC_PANEL_PORT
  pair: CC_PAIR_PORT
env:
  MITM_MODE: standalone
  SYNC_INTERVAL_MS: "60000"
  ACTIVITY_POLL_MS: "200"
  FIREWALL_URL: ""
  STORE_URL: ""
  RULES_URL: ""
  IDENTITIES_URL: ""
  PERMISSION_URL: ""
  CA_URL: ""
  ACTIVITY_URL: ""
  WEBHOOKS_URL: ""
  ORG_ID: ""
  BOX_ID: ""
  LOCAL_PANEL_BIND: "127.0.0.1:$PORT_PANEL"
  LOCAL_PANEL_SECURE_COOKIE: "0"
  PAIR_BIND: "0.0.0.0:$PORT_PAIR"
  PAIR_PROXY_ADDR: "10.77.5.9:8080"
  # The stores default to /opt/controlclaw/state, not STATE_DIR (backlog).
  LLM_STORE_PATH: "$ROOT/state/llm.enc"
  CHANNEL_STORE_PATH: "$ROOT/state/channels.enc"
files:
  keys/box_key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
steps:
  - name: signed in (session A)
    panel_login: panel
    request: {method: GET, path: /api/session, port: panel, jar: true}
    expect: {status: 200, json_subset: {admin: true}}
  - name: a second browser signs in (session B)
    request: {method: POST, path: /api/login, port: panel, json: {password: a conformance password}}
    keep: {sess_b: "set-cookie:cc_local_session"}
    expect: {status: 200, json_subset: {ok: true}}
  - name: a third signs in (session C, now in the jar)
    request: {method: POST, path: /api/login, port: panel, json: {password: a conformance password}}
    keep: {csrf_c: csrf}
    expect: {status: 200, json_subset: {ok: true}}
  - name: a wrong current password is refused, without signing out
    request: {method: POST, path: /api/admin/password, port: panel, jar: true, headers: {x-csrf-token: $csrf_c}, json: {current: not the password, new: a new conformance password}}
    expect: {status: 400}
  - name: the wrong try signed nobody out (session B)
    request: {method: GET, path: /api/session, port: panel, headers: {cookie: "cc_local_session=$sess_b"}}
    expect: {status: 200, json_subset: {admin: true}}
  - name: session C too
    request: {method: GET, path: /api/session, port: panel, jar: true}
    expect: {status: 200, json_subset: {admin: true}}
  - name: a new password under 12 characters is refused
    request: {method: POST, path: /api/admin/password, port: panel, jar: true, headers: {x-csrf-token: $csrf_c}, json: {current: a conformance password, new: short}}
    expect: {status: 400}
  - name: the password changes; the two other sessions end
    request: {method: POST, path: /api/admin/password, port: panel, jar: true, headers: {x-csrf-token: $csrf_c}, json: {current: a conformance password, new: a new conformance password}}
    expect: {status: 200, json_subset: {ok: true, signedOut: 2}}
  - name: session B is signed out
    request: {method: GET, path: /api/session, port: panel, headers: {cookie: "cc_local_session=$sess_b"}}
    expect: {status: 200, json_subset: {admin: false}}
  - name: session C stays signed in
    request: {method: GET, path: /api/session, port: panel, jar: true}
    expect: {status: 200, json_subset: {admin: true}}
  - name: the old password is refused
    request: {method: POST, path: /api/login, port: panel, json: {password: a conformance password}}
    expect: {status: 401}
  - name: the new one signs in
    request: {method: POST, path: /api/login, port: panel, json: {password: a new conformance password}}
    expect: {status: 200, json_subset: {ok: true}}
  - name: the pairing address is the proxy's host on the pairing port
    request: {method: GET, path: /api/pairing/address, port: panel, jar: true}
    expect: {status: 200, json_subset: {open: true, remoteUrl: null}, body_contains: ["\"url\":\"http://10.77.5.9:"]}
