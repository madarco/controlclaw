name: firewall ships the app and MCP call logs to Activity, each on its own cursor, other lines left out
agent: mitm-agent
env:
  ACTIVITY_POLL_MS: "200"
  CONNECTOR_GATE_BIND: 127.0.0.1
  CONNECTOR_URL: "http://127.0.0.1:9"
  CONNECTOR_ADMIN_TOKEN: admin-token
  CONNECTOR_STORE_PATH: state/connectors.enc
  CONNECTOR_CALLS_PATH: state/connector-calls.jsonl
  CONNECTOR_ASKS_PATH: state/connector-asks.json
  CONNECTOR_RUNS_POLL_MS: "600000"
  APPS_RULES_PATH: state/apps-rules.enc
  MCP_CATALOG_PATH: state/mcp-catalog.enc
  MCP_ASKS_PATH: state/mcp-asks.json
  MCP_SERVER_CALLS_PATH: state/mcp-server-calls.jsonl
ports:
  admission: MCP_ADMISSION_PORT
  tools: CONTROLPLANE_MCP_GATE_PORT
  connector: CONNECTOR_GATE_PORT
files:
  state/connector-calls.jsonl: |
    {"source":"connector_call","id":"c1","ts":1700000000.5,"duration_ms":12,"vm_id":"vm_a","route":"http","service":"github","action_id":"github.list-issues","decision":"allowed","by":"default","http_status":200,"ok":true}
    {"source":"connector_call","id":"c2","ts":1700000001,"duration_ms":0,"vm_id":"vm_a","route":"http","service":"github","action_id":"github.delete-repo","decision":"blocked","by":"app_rule","rule":"No deletes","rule_id":"r1"}
    {"source":"content_rule","id":"x1","ts":1700000002,"vm_id":"vm_a"}
    {"source":"connector_call","ts":1700000003,"vm_id":"vm_a"}
  state/mcp-server-calls.jsonl: |
    {"source":"connector_call","id":"m1","ts":1700000004,"duration_ms":30,"vm_id":"vm_a","route":"mcp_server","service":"mcp:notes","path":"search","decision":"allowed","by":"default","ok":true}
steps:
  - name: the app calls in one batch, the line that is not a call and the one with no id left out
    received:
      - path: /api/vm-agent/activity
        method: POST
        json_subset:
          records:
            - {source: connector_call, id: c1, ts: 1700000000.5, duration_ms: 12, vm_id: vm_a, route: http, service: github, action_id: github.list-issues, decision: allowed, by: default, http_status: 200, ok: true}
            - {source: connector_call, id: c2, ts: 1700000001, duration_ms: 0, vm_id: vm_a, route: http, service: github, action_id: github.delete-repo, decision: blocked, by: app_rule, rule: No deletes, rule_id: r1}
  - name: the MCP call in its own batch
    received:
      - path: /api/vm-agent/activity
        method: POST
        json_subset:
          records:
            - {source: connector_call, id: m1, ts: 1700000004, duration_ms: 30, vm_id: vm_a, route: mcp_server, service: "mcp:notes", path: search, decision: allowed, by: default, ok: true}
    files:
      state/connector-calls.jsonl.cursor: {json: {inode: $number, offset: $number}}
      state/mcp-server-calls.jsonl.cursor: {json: {inode: $number, offset: $number}}
