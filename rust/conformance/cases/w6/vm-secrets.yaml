name: vm-agent /secrets/apply takes only the firewall's secrets token and only placeholders
agent: vm-agent
steps:
  - request: {method: POST, path: /secrets/apply, json: {entries: []}, token: {signer: console}}
    expect:
      status: 401
      json: {error: Secrets changes must come from the org firewall}
      headers: {cache-control: no-store}
  - request: {method: POST, path: /secrets/apply, json: {entries: []}, token: {signer: firewall, bind: true, claims: {purpose: agentmail}}}
    expect:
      status: 401
  - request: {method: GET, path: /secrets/apply, token: {signer: firewall, bind: true, claims: {purpose: secrets}}}
    expect:
      status: 404
      json: {error: Not found}
  - request: {method: POST, path: /secrets/apply, json: {entries: [{name: API_TOKEN, placeholder: real-value}]}, token: {signer: firewall, bind: true, claims: {purpose: secrets}}}
    expect:
      status: 400
      json: {error: Invalid secret placeholders}
  - request: {method: POST, path: /secrets/apply, json: {entries: [{name: NODE_OPTIONS, placeholder: "CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}]}, token: {signer: firewall, bind: true, claims: {purpose: secrets}}}
    expect:
      status: 400
      json: {error: Invalid secret placeholders}
