name: secrets commands with nobody to send a code to
agent: mitm-agent
shims:
  - argv: [systemctl, is-active, controlclaw-mitmproxy]
    stdout: "inactive\n"
    code: 3
env:
  STORE_URL: "file:state/no-record.json"
steps:
  - name: nothing stored
    command:
      id: s_read
      action: secrets.read
      payload: {}
      result: {ok: true, status: read, data: {secrets: []}}
  - name: a new secret needs a code, and nobody can get one
    command:
      id: s_new
      action: secrets.propose
      payload:
        changeId: chg-1
        action: create
        name: API_TOKEN
        rules: {hosts: [api.example.com], locations: [{kind: header, name: Authorization, prefix: "Bearer "}]}
        vmIds: []
        agents: []
        secret: {value: "s3cret-value-not-real"}
      result: {ok: false, status: failed, message: "No confirmation code could be delivered. Add a recipient on the Firewall page."}
  - name: no code is waiting
    command:
      id: s_conf
      action: secrets.confirm
      payload: {changeId: chg-1, name: API_TOKEN, code: "123456"}
      result: {ok: false, status: expired, data: {}}
  - name: a malformed proposal
    command:
      id: s_bad
      action: secrets.propose
      payload: {changeId: chg-2, action: create, name: "bad name!"}
      result: {ok: false, status: failed, message: "Secrets change could not be applied. Check the input and firewall, then retry."}
  - name: cancel
    command:
      id: s_cancel
      action: secrets.cancel
      payload: {changeId: chg-1, name: API_TOKEN}
      result: {ok: true, status: cancelled}
  - name: still nothing stored
    command:
      id: s_read2
      action: secrets.read
      payload: {}
      result: {ok: true, status: read, data: {secrets: []}}
  - name: retry with nothing to retry
    command:
      id: s_retry
      action: secrets.retry
      payload: {}
      result: {ok: true, status: "applied"}
