name: vm-agent GET /health with the console's token
agent: vm-agent
shims:
  - argv: [systemctl, is-active, openclaw]
    stdout: "active\n"
  - argv: [systemctl, is-active, docker]
    stdout: "failed\n"
    code: 3
  - argv: [systemctl, cat, docker]
    stdout: "[Unit]\n"
steps:
  - name: no token
    request: {method: GET, path: /health}
    expect:
      status: 401
      headers: {content-type: application/json}
      body: '{"error":"Unauthorized"}'
  - name: console token
    request: {method: GET, path: /health, token: {signer: console}}
    expect:
      status: 200
      headers: {content-type: application/json}
      json:
        status: ok
        uptime: $number
        services:
          docker: stopped
          tailscaled: not-installed
          browser-stream: not-installed
          openclaw: running
