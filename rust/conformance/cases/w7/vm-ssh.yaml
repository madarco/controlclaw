name: vm-agent /ssh rescue access (who may open, the checks, close)
agent: vm-agent
shims:
  - argv: [sudo, /usr/local/bin/cc-ssh-close]
    stdout: "closed\n"
steps:
  - name: the console's token reads the status
    request: {method: GET, path: /ssh/status, token: {signer: console}}
    expect: {status: 200, json: {ok: true, open: false, user: ccsupport, grantId: null, fingerprint: null, endsAt: null}}
  - name: and the firewall's
    request: {method: GET, path: /ssh/status, token: {signer: firewall, bind: true, claims: {purpose: ssh}}}
    expect: {status: 200, json_subset: {ok: true, open: false}}
  - name: the console never opens one
    request: {method: POST, path: /ssh/open, json: {grantId: g1, seconds: 3600}, token: {signer: console}}
    expect: {status: 401, json: {error: shell access must come from the org firewall}}
  - name: another purpose
    request: {method: POST, path: /ssh/open, json: {grantId: g1, seconds: 3600}, token: {signer: firewall, bind: true, claims: {purpose: tailscale}}}
    expect: {status: 401}
  - name: a body without seconds
    request: {method: POST, path: /ssh/open, json: {grantId: g1}, token: {signer: firewall, bind: true, claims: {purpose: ssh}}}
    expect: {status: 400, json: {ok: false, error: grantId and seconds required}}
  - name: a window too short, refused before anything is minted
    request: {method: POST, path: /ssh/open, json: {grantId: g1, seconds: 60}, token: {signer: firewall, bind: true, claims: {purpose: ssh}}}
    expect: {status: 500, json: {ok: false, error: a shell access window must be between 300 and 259200 seconds}}
  - name: a grant id cc-ssh-open would not take
    request: {method: POST, path: /ssh/open, json: {grantId: "../x", seconds: 3600}, token: {signer: firewall, bind: true, claims: {purpose: ssh}}}
    expect: {status: 500, json: {ok: false, error: malformed grant id}}
  - name: close, with nothing open
    request: {method: POST, path: /ssh/close, json: {}, token: {signer: firewall, bind: true, claims: {purpose: ssh}}}
    expect:
      status: 200
      json: {ok: true, user: ccsupport, closed: false}
      calls_include: [[sudo, /usr/local/bin/cc-ssh-close]]
  - name: an unknown ssh route
    request: {method: POST, path: /ssh/other, json: {}, token: {signer: firewall, bind: true, claims: {purpose: ssh}}}
    expect: {status: 404, json: {error: Not found}}
