name: vm-agent /google on a box without gog
agent: vm-agent
steps:
  - name: the console never gives a box a Google account
    request: {method: POST, path: /google/apply, json: {placeholder: CC-GOOG-0123456789abcdef, connected: true, services: [gmail]}, token: {signer: console}}
    expect: {status: 401, json: {error: Google account changes must come from the org firewall}}
  - name: a Drive token is not a Google one
    request: {method: POST, path: /google/apply, json: {placeholder: CC-GOOG-0123456789abcdef, connected: true, services: [gmail]}, token: {signer: firewall, bind: true, claims: {purpose: drive}}}
    expect: {status: 401, json: {error: Google account changes must come from the org firewall}}
  - name: no token
    request: {method: GET, path: /google/status}
    expect: {status: 401, json: {error: Unauthorized}}
  - name: the firewall's apply says to update the agent
    request: {method: POST, path: /google/apply, json: {placeholder: CC-GOOG-0123456789abcdef, connected: true, services: [gmail]}, token: {signer: firewall, bind: true, claims: {purpose: google}}}
    expect: {status: 501, json: {error: "This agent does not have gog yet, so it cannot use your Google account. Update it."}}
  - name: and so does the console's read
    request: {method: GET, path: /google/status, token: {signer: console}}
    expect: {status: 501, json: {error: "This agent does not have gog yet, so it cannot use your Google account. Update it."}}
