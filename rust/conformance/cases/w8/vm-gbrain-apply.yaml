name: vm-agent POST /gbrain/apply takes only the firewall's gbrain token and only the brain's private address
agent: vm-agent
# No OpenClaw gateway in the rig: a valid apply answers 503 "not running", as the TS does with no
# gateway. The write itself is covered by rust/bins/vm-agent/src/gbrain/mcp/tests.rs.
steps:
  - name: no token
    request: {method: POST, path: /gbrain/apply, json: {remove: true}}
    expect: {status: 401, json: {error: brain changes must come from the org firewall}, headers: {cache-control: no-store}}
  - name: the console's token is not the firewall's
    request: {method: POST, path: /gbrain/apply, json: {remove: true}, token: {signer: console}}
    expect: {status: 401, json: {error: brain changes must come from the org firewall}}
  - name: another purpose
    request: {method: POST, path: /gbrain/apply, json: {remove: true}, token: {signer: firewall, bind: true, claims: {purpose: llm}}}
    expect: {status: 401}
  - name: an address that is not the brain's gate
    request: {method: POST, path: /gbrain/apply, json: {url: "https://evil.example/mcp"}, token: {signer: firewall, bind: true, claims: {purpose: gbrain}}}
    expect: {status: 400, json: {ok: false, error: "url must be the brain's private address (http://10.x.x.x:3131/mcp)"}}
  - name: with no gateway
    request: {method: POST, path: /gbrain/apply, json: {url: "http://10.0.0.9:3131/mcp"}, token: {signer: firewall, bind: true, claims: {purpose: gbrain}}}
    expect: {status: 503, json: {ok: false, error: OpenClaw is not running on this box}}
  - name: another path under /gbrain/
    request: {method: GET, path: /gbrain/connections}
    expect: {status: 404, json: {error: Not found}}
