name: a fresh standalone firewall blocks everything until rules are added
agent: mitm-agent
skip:
  ts: "standalone mode is in the Rust build only"
env:
  MITM_MODE: standalone
  SYNC_INTERVAL_MS: "300"
  # Unset, these default to local:, the firewall's own control plane with a new database.
  FIREWALL_URL: ""
  STORE_URL: ""
  RULES_URL: ""
  IDENTITIES_URL: ""
  PERMISSION_URL: ""
  CA_URL: ""
  ACTIVITY_URL: ""
  WEBHOOKS_URL: ""
  ORG_ID: ""
  BOX_ID: ""
  LOCAL_PANEL_BIND: "127.0.0.1:0"
files:
  keys/box_key: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
steps:
  - name: the proxy gets one rule, block every host, so a client's request is refused
    files:
      run/rules.json:
        json:
          - {id: block-all, name: Block everything until you add rules, match_domain: "*", effect: block, priority: 100000}
