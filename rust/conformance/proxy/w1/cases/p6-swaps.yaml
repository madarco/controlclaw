files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: a}]
  credentials.json:
    - {secret_name: API_TOKEN, placeholder: CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, secret: private-test-value, vm_id: a,
       allowed_hosts: [secret.test], secret_locations: [{kind: header, name: authorization, prefix: "Bearer "}]}
steps:
  - http: {url: "https://secret.test:9/x", headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {status: 502}
  - log: {last: {effect: allow, error: Secret request failed, swapped: [API_TOKEN]}}
---
name: the included key is swapped only for its models and the model list
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: test-agent}]
  credentials.json:
    - {placeholder: vck-cc-included123, match_domain: ai-gateway.vercel.sh, secret: vck_real,
       locations: ["header:authorization"], allowed_models: [moonshotai/kimi-k2.6], included: true}
steps:
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST,
           body: {model: moonshotai/kimi-k2.6}, headers: {Authorization: Bearer vck-cc-included123}}
    expect: {status: 200, json: {headers: {Authorization: Bearer vck_real}}}
  - log: {last: {effect: allow, included: ok}}
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST,
           body: {model: anthropic/claude-opus-5}, headers: {Authorization: Bearer vck-cc-included123}}
    expect: {status: 400, json: {error: {code: model_not_included, type: invalid_request_error,
             message: "anthropic/claude-opus-5 is not included in your plan. Included models: moonshotai/kimi-k2.6. Pick one of your plan's models, or add your own provider key in ControlClaw under Model providers."}}}
  - log: {last: {effect: block, rule: included_ai, status: 400}}
  - http: {url: "https://ai-gateway.vercel.sh/v1/models", headers: {Authorization: Bearer vck-cc-included123}}
    expect: {status: 200}
  - http: {url: "https://ai-gateway.vercel.sh/v1/credits", headers: {Authorization: Bearer vck-cc-included123}}
    expect: {status: 400}
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST, body: "{}",
           headers: {Authorization: Bearer vck-cc-included123}}
    expect: {status: 400, json: {error: {message: "$contains:the request names no model"}}}
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST, body: {model: x},
           headers: {Authorization: Bearer sk-own}}
    expect: {status: 200}
  - log: {last: {included: $absent}}
  - seen: {server: origin, requests: 3}
---
name: the gateway's 402 is reworded and classified
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: test-agent}]
  credentials.json:
    - {placeholder: vck-cc-included123, match_domain: ai-gateway.vercel.sh, secret: vck_real,
       locations: ["header:authorization"], allowed_models: [m], included: true}
steps:
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST, body: {model: m},
           headers: {Authorization: Bearer vck-cc-included123},
           respond: {status: 402, headers: {Content-Type: application/json},
                     body: '{"error": {"type": "quota_for_entity_exceeded", "message": "key api_key_id_1 over $5"}}'}}
    expect: {status: 402, headers: {content-type: application/json},
             json: {error: {code: included_tokens_used_up, type: invalid_request_error}}}
  - log: {last: {included: used_up, status: 402}}
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST, body: {model: m},
           headers: {Authorization: Bearer vck-cc-included123},
           respond: {status: 402, body: '{"error": {"message": "Your credit balance is too low"}}'}}
    expect: {status: 402, json: {error: {code: included_ai_no_credit}}}
  - log: {last: {included: no_credit}}
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST, body: {model: m},
           headers: {Authorization: Bearer vck-cc-included123}, respond: {status: 503, body: down}}
    expect: {status: 503, body: down}
  - log: {last: {included: $absent}}
  - http: {url: "https://ai-gateway.vercel.sh/v1/chat/completions", method: POST, body: {model: m},
           headers: {Authorization: Bearer sk-own}, respond: {status: 402, body: original}}
    expect: {status: 402, body: original}
---
name: a model provider's refusal is classified on the record, without its body
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: test-agent}]
  credentials.json:
    - {placeholder: sk-cc-openai, match_domain: api.openai.com, secret: sk_openai_real, locations: ["header:authorization"], model: true}
    - {placeholder: sk-ant-cc, match_domain: api.anthropic.com, secret: sk_ant_real, locations: ["header:x-api-key"], model: true}
    - {placeholder: or-cc, match_domain: openrouter.ai, secret: or_real, locations: ["header:authorization"], model: true}
    - {placeholder: sk-cc-custom, match_domain: www.origin.test, secret: sk_real, locations: ["header:authorization"], model: true}
steps:
  - http: {url: "https://api.openai.com/v1/chat/completions", method: POST, body: {model: x}, headers: {Authorization: Bearer sk-cc-openai},
           respond: {status: 401, body: '{"error": {"code": "invalid_api_key"}}'}}
  - log: {last: {model_error: auth, status: 401}}
  - http: {url: "https://api.openai.com/v1/chat/completions", method: POST, body: {model: x}, headers: {Authorization: Bearer sk-cc-openai},
           respond: {status: 403, body: '{"error": "region not supported"}'}}
  - log: {last: {model_error: $absent, status: 403}}
  - http: {url: "https://api.openai.com/v1/chat/completions", method: POST, body: {model: x}, headers: {Authorization: Bearer sk-cc-openai},
           respond: {status: 429, body: '{"error": {"type": "insufficient_quota"}}'}}
  - log: {last: {model_error: credit}}
  - http: {url: "https://api.anthropic.com/v1/messages", method: POST, body: {model: x}, headers: {X-Api-Key: sk-ant-cc},
           respond: {status: 400, body: '{"error": {"message": "Your credit balance is too low to access the API"}}'}}
  - log: {last: {model_error: credit}}
  - http: {url: "https://openrouter.ai/api/v1/chat", method: POST, body: {model: x}, headers: {Authorization: Bearer or-cc},
           respond: {status: 402, body: "{}"}}
  - log: {last: {model_error: credit}}
  - http: {url: "https://api.openai.com/v1/chat/completions", method: POST, body: {model: x}, headers: {Authorization: Bearer sk-cc-openai},
           respond: {status: 429, body: '{"error": "slow down"}'}}
  - log: {last: {model_error: rate_limit}}
  - http: {url: "https://api.openai.com/v1/chat/completions", method: POST, body: {model: x}, headers: {Authorization: Bearer sk-own},
           respond: {status: 401, body: "{}"}}
  - log: {last: {model_error: $absent}}
  - http: {url: "https://api.openai.com/v1/models", headers: {Authorization: Bearer sk-cc-openai}, respond: {status: 401, body: "{}"}}
  - log: {last: {model_error: $absent}}
  - http: {url: "https://www.origin.test/v1/chat", method: POST, body: {model: x}, headers: {Authorization: Bearer sk-cc-custom},
           respond: {status: 401, body: "{}"}}
  - log: {last: {model_error: auth}}
  - http: {url: "https://api.openai.com/v1/chat/completions", method: POST, body: {model: x}, headers: {Authorization: Bearer sk-cc-openai}}
  - log: {last: {model_error: $absent, status: 200}}
