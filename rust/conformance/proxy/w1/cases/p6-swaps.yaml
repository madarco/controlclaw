# P6: credential swaps (legacy and custom secrets), the included AI, model errors (features 4, 5,
# 14, 15). Ported from test_secrets.py, test_included.py, test_model_errors.py and run-smoke.sh's
# swap checks.
name: a legacy credential is swapped on its own domain only, and its name goes on the record
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: test-agent}]
  credentials.json:
    - {placeholder: __ECHO_TOKEN, secret: REAL-SECRET-abc123, match_domain: origin.test}
    - {placeholder: __PATH_TOKEN, secret: path-secret, match_domain: origin.test, locations: [path, query, body, "header:x-token"]}
steps:
  - http: {url: "https://origin.test/bot__PATH_TOKEN/send?t=__PATH_TOKEN&z=1", method: POST,
           body: "token=__PATH_TOKEN", headers: {Authorization: Bearer __ECHO_TOKEN, X-Token: a-__PATH_TOKEN-b,
                                                 Content-Type: application/x-www-form-urlencoded}}
    expect: {status: 200, json: {path: "/botpath-secret/send?t=path-secret&z=1", body: token=path-secret,
                                 headers: {Authorization: Bearer REAL-SECRET-abc123, X-Token: a-path-secret-b}}}
  - log: {last: {effect: allow, swapped: [__ECHO_TOKEN, __PATH_TOKEN]}}
  - http: {url: "https://other.test/x", headers: {Authorization: Bearer __ECHO_TOKEN}}
    expect: {status: 200, json: {headers: {Authorization: Bearer __ECHO_TOKEN}}}
  - log: {last: {swapped: []}}
  - output: {lacks: [REAL-SECRET-abc123]}
---
name: the record keeps the path as the agent sent it, so a path credential never reaches the log
skip: {mitmproxy: "the addon records the path after the swap (host review of #543, item 4)"}
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: test-agent}]
  credentials.json:
    - {placeholder: __PATH_TOKEN, secret: path-secret, match_domain: origin.test, locations: [path]}
steps:
  - http: {url: "https://origin.test/bot__PATH_TOKEN/send?q=1"}
    expect: {status: 200, json: {path: "/botpath-secret/send?q=1"}}
  - log: {last: {effect: allow, swapped: [__PATH_TOKEN], path: /bot__PATH_TOKEN/send}}
  - log: {file: traffic.jsonl, where: {path: /botpath-secret/send}, count: 0}
---
name: over plain HTTP nothing is swapped, whatever the request names
skip: {mitmproxy: "the 12.2.2 addon here swaps over plain HTTP; production refuses (T-sni, host review of #543)"}
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: a}]
  credentials.json:
    - {placeholder: __PATH_TOKEN, secret: path-secret, match_domain: origin.test, locations: [path, query]}
    - {placeholder: sk-cc-openai, match_domain: api.openai.com, secret: sk_openai_real, locations: ["header:authorization"], model: true}
    - {secret_name: API_TOKEN, placeholder: CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, secret: private-test-value, vm_id: a,
       allowed_hosts: [secret.test], secret_locations: [{kind: header, name: authorization, prefix: "Bearer "}]}
steps:
  # A path credential, behind redsocks (CONNECT ip:80).
  - http: {url: "http://origin.test/bot__PATH_TOKEN/getMe?t=__PATH_TOKEN"}
    expect: {status: 200, json: {path: "/bot__PATH_TOKEN/getMe?t=__PATH_TOKEN"}}
  # A header credential, the Host naming the provider.
  - http: {url: "http://api.openai.com/v1/chat/completions", method: POST, body: {model: x},
           headers: {Authorization: Bearer sk-cc-openai}}
    expect: {status: 200, json: {headers: {Authorization: Bearer sk-cc-openai}}}
  # A custom secret, absolute-form to the proxy.
  - http: {via: absolute, url: "http://secret.test/x", headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {status: 200, json: {headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}}
  - log: {where: {swapped: [__PATH_TOKEN]}, count: 0}
  - output: {lacks: [path-secret, sk_openai_real, private-test-value]}

---
name: an agent's own credential beats the org one, another agent's is never used
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: a}, {private_ip: 10.0.0.4, vm_id: b}]
  credentials.json:
    - {placeholder: __K, secret: org-key, match_domain: origin.test}
    - {placeholder: __K, secret: a-key, match_domain: origin.test, vm_id: a}
steps:
  - http: {url: "https://origin.test/", headers: {Authorization: Bearer __K}}
    expect: {json: {headers: {Authorization: Bearer a-key}}}
  - http: {agent: agent2, url: "https://origin.test/", headers: {Authorization: Bearer __K}}
    expect: {json: {headers: {Authorization: Bearer org-key}}}
---
name: a custom secret goes only to its hosts, its agent, its exact places
files:
  identities.json: [{private_ip: 10.0.0.3, vm_id: a}, {private_ip: 10.0.0.4, vm_id: b}]
  credentials.json:
    - {secret_name: API_TOKEN, placeholder: CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, secret: private-test-value, vm_id: a,
       allowed_hosts: [secret.test, "*.origin.test"],
       secret_locations: [{kind: header, name: authorization, prefix: "Bearer "}, {kind: query, name: api_key}]}
steps:
  - http: {url: "https://secret.test/echo?api_key=CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&other=CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", method: POST, body: "CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
           headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, X-Other: CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {status: 200, json: {path: "/echo?api_key=private-test-value&other=CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", body: "CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                                 headers: {Authorization: Bearer private-test-value, X-Other: CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}}
  - log: {last: {effect: allow, swapped: [API_TOKEN]}}
  - http: {url: "https://www.origin.test/x", headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {json: {headers: {Authorization: Bearer private-test-value}}}
  - http: {url: "https://origin.test/x", headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {json: {headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}}
  - http: {url: "https://secret.test/x", headers: {Authorization: Basic CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {json: {headers: {Authorization: Basic CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}}
  - http: {agent: agent2, url: "https://secret.test/x", headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {json: {headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}}
  - http: {url: "https://other.test/x", headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}
    expect: {json: {headers: {Authorization: Bearer CC-SEC-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}}
  - output: {lacks: [private-test-value]}
