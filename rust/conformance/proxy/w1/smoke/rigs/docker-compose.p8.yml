# Per-VM identity smoke (P8.1). TWO agent boxes with STATIC private IPs share one proxy; the
# proxy resolves each connection's source IP → vm_id (identities.json) and applies VM-scoped rules
# + VM-scoped credentials (with org fallback). Mirrors the per-org mitm box serving multiple VMs.
services:
  echo:
    image: python:3.12-alpine
    command: ["python", "/app/echo-server.py"]
    volumes:
      - ./echo-server.py:/app/echo-server.py:ro
      - ./echo-certs:/certs:ro
    networks:
      extnet:
        aliases: [echo.test, other.test]

  proxy:
    image: mitmproxy/mitmproxy:12.2.2
    command: >
      mitmdump --listen-port 8080 --ssl-insecure
      --set confdir=/ca -s /app/addon.py
    volumes:
      - ../addon.py:/app/addon.py:ro
      - ./ca:/ca
      - ./config:/config:ro
      - ./logs:/logs
    environment:
      MITM_TENANT: "p8-org"
      MITM_RULES_PATH: /config/rules.json
      MITM_CREDENTIALS_PATH: /config/credentials.json
      MITM_IDENTITIES_PATH: /config/identities.json
      MITM_GRANTS_PATH: /config/grants.json
      MITM_PENDING_PATH: /logs/pending.jsonl
      MITM_LOG_FILE: /logs/mitm.jsonl
    networks: [intnet, extnet]

  vma:
    build: { context: ., dockerfile: Dockerfile.agent }
    command: ["sleep", "infinity"]
    volumes: [./ca:/ca:ro]
    networks:
      intnet:
        ipv4_address: 10.66.0.11

  vmb:
    build: { context: ., dockerfile: Dockerfile.agent }
    command: ["sleep", "infinity"]
    volumes: [./ca:/ca:ro]
    networks:
      intnet:
        ipv4_address: 10.66.0.12

networks:
  intnet:
    internal: true
    ipam:
      config:
        - subnet: 10.66.0.0/24
  extnet: {}
