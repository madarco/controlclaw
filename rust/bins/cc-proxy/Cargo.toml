[package]
name = "cc-proxy"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The workspace's lints, except `unsafe_code` is `deny`, not `forbid`: `forbid` cannot be lifted
# by an inner `allow`, and exactly one function may call C (`tls::anchors::set_requested`, owner
# 2026-10-28). Any other `unsafe` is still refused, and a test checks there is no second `allow`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cc-proxy"
path = "src/main.rs"

[dependencies]
mimalloc.workspace = true
cc-contracts = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
idna = "1"
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "5"
ruzstd = "0.8"
sha2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
tls-parser = "0.12"
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
http-body = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# The upstream TLS handshake copies the agent's ClientHello (owner, 2026-10-28): BoringSSL with
# the extension order, TLS 1.3 cipher list and key-share settings exposed.
btls = "0.5.6"
tokio-btls = "0.5.6"
# For the one FFI call (`tls::anchors`): the raw binding and the pointer behind `SslRef`.
btls-sys = "0.5.6"
foreign-types = "0.5"
# The upstream HTTP/2 connection copies the agent's SETTINGS order and pseudo-header order.
http2 = { version = "0.5.20", features = ["unstable"] }
hpack = "0.3"
rustls-pemfile = { workspace = true }
rustls-native-certs = { workspace = true }
webpki-roots = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
# W2 (checks); sha2 and hex are above
regex = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
encoding_rs = "0.8"

[dev-dependencies]
tempfile = { workspace = true }

